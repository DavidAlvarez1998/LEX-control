  convertir: juridico-incluido # Q1 usuario: cliente.convertir += JURIDICO (el abogado activa su propio intake)
  pertenencia: sin-muro-aviso # Q2 usuario: estándar bufete (Clio) — sin bloqueo + "Responsable: Fulano" + confirm suave
  responsable_default: creador # POST /clientes auto-asigna responsableComercialId = creador (antes quedaba null)
  responsable_semantica: originador # "responsable" puede ser JURIDICO o COMERCIAL; se relaja la guía blanda "SHOULD COMERCIAL" (nunca enforced)
