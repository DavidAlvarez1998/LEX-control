  design: done
  tasks: done
  apply: done # API + RBAC re-seed + frontend
  verify: green # tsc API + next build cliente limpios; 377/377 tests; re-seed OK; SMOKE EN VIVO 3/3 (BD real, sin residuo)
  archive: done # archivado 2026-06-16
capabilities:
  modified:
    - clientes # convertir+JURIDICO, auto-responsable=creador, reads exponen responsable, sin muro de pertenencia
notes: |
  Creado 2026-06-11. APLICADO+VERIFICADO el mismo día. El reporte ("no deja pasar a cliente el de otro")
  NO era un muro de pertenencia (no existe): era RBAC — JURIDICO no tenía cliente.convertir → 403
