change: integraciones-estatales
artifact_store: openspec
execution_mode: interactive
delivery_strategy: phased-by-feasibility # ship Corte Constitucional (free API) first; defer scrape/aggregator
decisions:
  carved_from: legal-tramites-phase5 # era la "Phase 5" del change legal-tramites (ya archivado); spec canónica en openspec/specs/integraciones-estatales/
  provider_order: corteconst-first # Corte Const. SODA (api, gratis) → CPNU (scrape, Redis+Playwright) → RUES (aggregator, llaves pago)
  phase_a_stateless: true # consulta de jurisprudencia sin persistencia → sin cambio de schema
  phase_b_done: 2026-06-16 # DESBLOQUEADA: la ventana de schema se abrió (contratos/documentos ya commiteado). Modelos ActuacionJudicial/IntegrationSyncLog/ProviderConfig + motor de sync idempotente IMPLEMENTADOS con proveedor MOCK (CPNU/RUES reales siguen en C/D)
  cpnu_infra: redis+playwright # cola BullMQ + worker Playwright, rate-limit por host, circuit breaker; NUNCA inline
  rues_creds: per-despacho-encrypted # ProviderConfig con llave API por despacho (Apitude/Verifik-class)
  compliance: ley-1581-2012 # habeas data; borrar datos sincronizados al borrar proceso; UA identificable; DPA con agregadores
phases:
  explore: done # leído el spec canónico integraciones-estatales + tasks de la Phase 5 archivada
  propose: done
  spec: reuse-canonical # openspec/specs/integraciones-estatales/ (promovida al archivar legal-tramites)
  design: done # interfaz ProviderAdapter + DTOs normalizados; adapter aislado estilo documentos.client
  tasks: phased # A (foundation+CorteConst) HECHA / B (persistencia+sync) HECHA (2026-06-16, mock) / C (CPNU scrape) / D (RUES) bloqueadas por infra+llaves ausentes en este entorno
  validate: green # pnpm build limpio; 399/399 tests (+7 unit crypto/mock); smoke e2e BD real 20/20 (scripts/smoke-integraciones-sync.ts)
  apply: phaseB-done # Phase A (commit ea8495a) + Phase B (2026-06-16): schema 3 modelos+enum (db push) + crypto.ts (AES-256-GCM creds) + mockActuaciones.client.ts + actuacionesSync.service.ts (idempotente hash+timeline+log+caché TTL) + proveedores.ts (registry/ProviderConfig) + router (sincronizar/actuaciones/sync-logs/config) reusa proceso.ver/editar
  verify: phaseB-green # build + 399 tests + e2e 20/20: idempotencia, no-op sin radicado, proyección timeline, caché TTL, proveedor deshabilitado, cross-tenant 404, cifrado credenciales, cascade habeas-data
  archive: done # archivado 2026-06-16 (v1 A+B; C/D = carve-out futuro, bloqueadas por infra/llaves ausentes)
capabilities:
  modified:
    - integraciones-estatales # implementa el spec ya canónico
notes: |
  Creado 2026-06-09 al archivar legal-tramites + derecho-peticion. NO se implementó código aún: la
  Phase A (Corte Constitucional SODA) es factible (API REST gratuita), pero requiere decisión de
  arranque del usuario; las Phases C/D están bloqueadas por infra (Redis/Playwright) y llaves de pago
  que no existen en este entorno; la Phase B (persistencia) está bloqueada hasta que el trabajo
  paralelo de contratos/documentos en schema.prisma se commitee (para no enredar commits).
next: Phases A+B APLICADAS+VERIFICADAS (v1). El motor de sync corre contra un proveedor MOCK
  determinista (env.integraciones.mockActuaciones, ON en dev/test, OFF en prod). Para enchufar un
  proveedor REAL de actuaciones: implementar Phase C (CPNU scrape, requiere Redis+Playwright) o D
  (RUES, requiere llave de pago por despacho en ProviderConfig) — ambos bloqueados en este entorno.
  Para jurisprudencia real (Phase A): configurar CORTE_CONST_DATASET con el dataset de la relatoría.
  Decisión pendiente: archivar v1 (A+B) o dejar el change abierto esperando C/D.
