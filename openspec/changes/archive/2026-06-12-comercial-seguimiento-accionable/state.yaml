change: comercial-seguimiento-accionable
artifact_store: openspec
execution_mode: interactive
delivery_strategy: phased # schema → endpoints → frontend → tests
decisions:
  alcance: paquete-completo # cockpit "Para hoy" + lista enriquecida + cerrar ciclo + alertas accionables
  disposicion: enum # DisposicionGestion en SeguimientoComercial (cambio de schema, db push)
  derivacion: on-read # señales (diasSinGestion/proximaTarea/faseActual/diasEnFase) calculadas, NO almacenadas (igual que alertas)
  cockpit_ruta: nueva # /seguimiento como vista diaria; /clientes sigue siendo el pipeline completo
  perdido_atajo: reusa-fase # NO_VIABLE → POST /clientes/:id/fase PERDIDO
  permisos: reusa # comercial.seguimiento.ver / comercial.alertas.ver; sin permisos nuevos
phases:
  explore: done # mapa comercial (modelo + router + UI + specs) vía 2 Explore agents
  propose: done
  design: done # plan aprobado (plan file en ~/.claude/plans)
  spec: done # 1 added (comercial-pipeline) + 3 modified (comercial-seguimiento/alertas/clientes) → specs/ deltas
  tasks: done # entregado por fases (schema → endpoints → frontend → tests)
  validate: done
  apply: done # api 89a0f91 (pipeline+hoy+disposicion) + client f6c1f99 (cockpit "Para hoy" + lista enriquecida + cerrar ciclo); db push aplicado (enum DisposicionGestion + columna disposicion)
  verify: done # 380 tests verdes + client build verde (/seguimiento) + smoke EN VIVO scripts/smoke-seguimiento.ts (pipeline diasSinGestion/tareaVencida/diasEnFase, hoy buckets, disposicion persiste → ultimaDisposicion)
  archive: done # 2026-06-12; specs promovidas a openspec/specs/ (comercial-pipeline added; comercial-seguimiento/alertas/clientes modified)
capabilities:
  modified:
    - comercial-seguimiento # campo disposicion + cerrar ciclo
    - comercial-alertas # items accionables (nombre/telefono)
    - clientes # señales derivadas en la lista
  added:
    - comercial-pipeline # /comercial/pipeline + /comercial/hoy (cockpit)
notes: |
  Evaluación: el seguimiento captura lo correcto pero no impulsa el día a día; la mejora es
  exponer las señales y cerrar el ciclo del contacto, no agregar más data. Decisiones del usuario:
  paquete completo + enum de disposicion.
next: Aplicar schema (enum+columna, db push), endpoints pipeline/hoy/alertas, frontend (/seguimiento,
  /clientes, registrar-gestion, Inicio), tests + smoke.
