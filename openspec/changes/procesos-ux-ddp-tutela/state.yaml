notes: |
  Created 2026-06-12. PROPOSED + SPEC only (not applied). UX-focused change for the proceso module with
  Derecho de Petición & Tutela as the driving cases, but generic across all TipoProceso. Theme: make the
  module deadline-first and the DdP/tutela flow legible. Five themes: (A) surface vencimientos in the
  list column, the home card and the ficha countdown — reusing the already-derived fechaLimite/semáforo,
  with a UI-only "vence hoy"; (B) list text search (código/título/cliente/radicado) + responsable filter
  via two read-only params on GET /procesos; (C) the caso as a unit — per-row caso marker + CasoChain
  showing each node's current stage; (D) promote the reiterar/escalar (crearDerivado) decision to a
  contextual CTA; (E) stepper legibility — show plazo per stage, emphasize tutela's 3-day impugnación,
  present DdP branches as response-driven alternatives. Strictly presentation: no schema, no RBAC, no
  changes to the stage state machine, gates, branch semantics, derivation idempotency, or vencimiento
  math. Out of scope: standalone /vencimientos route, list tree-collapse by caso, tutela-specific new
  fields/stages (medida provisional / cumplimiento-desacato → separate domain proposal), admin portal.
  Context: builds on this session's already-applied (uncommitted) fixes to the ficha — back-stage
  navigation/reopen, layout reorder (etapas up), generar/descargar .doc, poder inheritance on
  reiteración, documentos requeridos disponibleSi. Those are the substrate; this change formalizes the
  remaining UX gaps.
next: APPLIED A–E (build-green, sin commit final del SDD-state). Pendiente: tests del q/responsableId
  scoping en lex-control-api + smoke en vivo (DdP cerca del vencimiento → home card + lista rojo/ámbar;
