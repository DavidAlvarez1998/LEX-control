  design: done # interfaz ProviderAdapter + DTOs normalizados; adapter aislado estilo documentos.client
  tasks: phased # A (foundation+CorteConst) HECHA / B (persistencia+sync) / C (CPNU scrape) / D (RUES) pendientes
  validate: pending
  apply: phaseA-done # rama feat/integraciones-estatales, commit ea8495a. src/modules/integraciones/ (types/client/router/schemas) + GET /integraciones/jurisprudencia + env.integraciones.corteConstitucional. Staging selectivo por hunks (env/app tenían trabajo paralelo del usuario). 5 tests; 342 total
  verify: phaseA-green # pnpm build limpio; 342/342 tests; smoke en vivo auth→router→adapter→API OK (502 esperado: datasetId placeholder, configurar CORTE_CONST_DATASET para datos reales)
  archive: pending # tras completar al menos B (persistencia) — o decisión del usuario
capabilities:
